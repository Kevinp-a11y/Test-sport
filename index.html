<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120F;
    --surface: #1E1B17;
    --surface-2: #262219;
    --surface-3: #2E2A1F;
    --border: rgba(255, 143, 92, 0.14);
    --border-strong: rgba(255, 143, 92, 0.30);
    --ink: #F2EDE4;
    --ink-dim: rgba(242, 237, 228, 0.60);
    --ink-faint: rgba(242, 237, 228, 0.32);
    --ember: #FF6B35;
    --ember-bright: #FF8F5C;
    --push: #FF6B35;
    --pull: #4FA8D8;
    --abs: #E0B84F;
    --cardio: #6FCF97;
    --epaules: #C77DFF;
    --biceps: #F2545B;
    --triceps: #F4A259;
    --danger: #E06157;
    --success: #6FCF97;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* police d'affichage : Bebas Neue si dispo (CDN, mise en cache après 1re visite),
       sinon repli condensé natif — l'app reste lisible hors-ligne */
    --display: 'Bebas Neue', 'Oswald', 'Antonio', 'Arial Narrow', 'Helvetica Neue Condensed', 'Impact', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    min-height: 100%;
  }

  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ambient::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% -10%, rgba(255, 107, 53, 0.12), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(79, 168, 216, 0.08), transparent 45%),
      radial-gradient(circle at 92% 70%, rgba(224, 184, 79, 0.06), transparent 45%);
  }

  #app {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }
  .screen.scrollable.active { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  ::-webkit-scrollbar { display: none; }

  /* ============ TOPBAR / NAV ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 6px;
  }
  .topbar-title { font-family: var(--display); font-size: 26px; letter-spacing: 0.04em; color: var(--ember-bright); }
  .streak-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 12px; font-size: 12.5px; font-weight: 600;
  }

  .content { padding: 8px 20px 20px; flex: 1; }

  .navbar {
    display: flex; border-top: 1px solid var(--border);
    background: var(--surface); padding-bottom: var(--safe-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px 8px; color: var(--ink-faint); cursor: pointer;
  }
  .nav-btn.active { color: var(--ember-bright); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn span { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }

  /* ============ CARDS génériques ============ */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 18px;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 22px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* ============ HOME ============ */
  .today-card {
    border-radius: 22px; padding: 24px 20px; margin-top: 4px;
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, var(--surface-3), var(--surface));
    border: 1px solid var(--border-strong);
  }
  .today-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .today-title { font-family: var(--display); font-size: 34px; letter-spacing: 0.02em; margin-bottom: 4px; }
  .today-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 18px; }
  .today-meta { display: flex; gap: 16px; margin-bottom: 18px; }
  .today-meta-item { font-size: 12px; color: var(--ink-dim); }
  .today-meta-item b { color: var(--ink); font-weight: 700; }
  .today-btn {
    display: block; width: 100%; text-align: center;
    background: var(--ember); color: #14120F; font-weight: 800; font-size: 15px;
    border-radius: 100px; padding: 15px; cursor: pointer;
  }
  .today-btn:active { transform: scale(0.98); }
  .today-btn.secondary {
    background: transparent; border: 1px solid var(--border-strong); color: var(--ink);
    margin-top: 8px;
  }

  .prog-card.reco { border-color: rgba(111,207,151,0.4); }
  .prog-card:not(.reco) { background: var(--surface); }
  .prog-title-alt { font-family: var(--display); font-size: 22px; letter-spacing: 0.02em; margin-bottom: 4px; }
  .prog-lastdone { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  .rest-card {
    border-radius: 22px; padding: 24px 20px; margin-top: 4px; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
  }
  .rest-mark { font-size: 40px; margin-bottom: 10px; }
  .rest-title { font-family: var(--display); font-size: 26px; margin-bottom: 6px; }
  .rest-text { font-size: 13px; color: var(--ink-dim); }

  .cardio-mini {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px; margin-top: 12px; cursor: pointer;
  }
  .cardio-mini-icon {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: rgba(111, 207, 151, 0.15); color: var(--cardio);
    display: flex; align-items: center; justify-content: center;
  }
  .cardio-mini-icon svg { width: 20px; height: 20px; }
  .cardio-mini-name { font-weight: 700; font-size: 14px; }
  .cardio-mini-desc { font-size: 11.5px; color: var(--ink-dim); }
  .cardio-mini-arrow { margin-left: auto; color: var(--ink-faint); }

  .badge-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 6px; }
  .badge-chip {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 14px; min-width: 84px; text-align: center;
  }
  .badge-chip.locked { opacity: 0.35; }
  .badge-chip-mark { font-size: 22px; }
  .badge-chip-label { font-size: 9.5px; font-weight: 700; color: var(--ink-dim); line-height: 1.3; }

  /* ============ LIBRARY ============ */
  .group-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .group-tab {
    flex-shrink: 0; padding: 9px 16px; border-radius: 100px; font-size: 12.5px; font-weight: 700;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-dim); cursor: pointer;
  }
  .group-tab.active { background: var(--ember); border-color: var(--ember); color: #14120F; }

  .ex-card {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ember);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .ex-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .ex-name { font-weight: 700; font-size: 15px; }
  .ex-tier { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; background: var(--surface-2); color: var(--ink-dim); }
  .ex-desc { font-size: 12px; color: var(--ink-dim); line-height: 1.4; }
  .ex-target { font-size: 11.5px; color: var(--ember-bright); font-weight: 600; margin-top: 6px; }

  /* ============ SESSION GUIDÉE ============ */
  .session-bar {
    display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; flex-shrink: 0;
  }
  .session-meta { flex: 1; }
  .session-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .session-name { font-size: 15px; font-weight: 700; }

  .progress-track { height: 4px; background: var(--surface-2); margin: 0 18px 6px; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--ember); border-radius: 4px; transition: width 0.3s; }

  .ex-dots { display: flex; gap: 6px; justify-content: center; padding: 8px 0 4px; }
  .ex-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
  .ex-dot.done { background: var(--success); }
  .ex-dot.current { background: var(--ember); width: 18px; border-radius: 4px; }

  .session-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 20px; min-height: 0; }

  .exec-card {
    width: 100%; max-width: 400px; text-align: center;
  }
  .exec-group-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 100px; margin-bottom: 14px;
  }
  .exec-name { font-family: var(--display); font-size: 40px; letter-spacing: 0.02em; }
  .exec-name-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .exec-info-btn {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    font-style: italic; color: var(--ink-dim); cursor: pointer; flex-shrink: 0; margin-top: 6px;
  }
  .exec-info-btn:active { background: var(--surface-2); }
  .exec-tooltip {
    display: none; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin: 0 0 14px; text-align: left;
  }
  .exec-tooltip.show { display: block; }
  .exec-tier-name { font-size: 14px; color: var(--ink-dim); margin-bottom: 22px; }

  .timer-ring-wrap { position: relative; width: 200px; height: 200px; margin: 0 auto 22px; }
  .timer-ring-wrap svg { transform: rotate(-90deg); }

// pioche les exercices du jour pour un programme donné, en tournant dans chaque pool
// à chaque fois que ce programme est complété (voir finishSession) — assure la variété
function pickFromPool(progId, block) {
  const key = progId + ':' + block.group;
  const offset = (S.poolOffset && S.poolOffset[key]) || 0;
  const n = Math.min(block.pick, block.pool.length);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(block.pool[(offset + i) % block.pool.length]);
  return picked;
}
function buildProgramExerciseIds(prog) {
  return prog.blocks.reduce((acc, b) => acc.concat(pickFromPool(prog.id, b)), []);
}
function lastDoneLabel(progId) {
  const d = S.lastDoneByProgram && S.lastDoneByProgram[progId];
  if (!d) return 'Jamais faite';
  const [y,m,day] = d.split('-');
  return `Dernière fois : ${day}/${m}/${y}`;
}
function recommendedProgramId() {
  let best = null, bestDate = null;
  PROGRAM.forEach(p => {
    const d = (S.lastDoneByProgram && S.lastDoneByProgram[p.id]) || '';
    if (best === null || d < bestDate) { best = p.id; bestDate = d; }
  });
  return best;
}

  const last = ex.tiers[ex.tiers.length - 1];
  const step = progressionStep(ex);
  const numericSteps = ex.maxTarget ? Math.max(0, Math.round((ex.maxTarget - last.target) / step)) : 0;
  return tierSteps + numericSteps;
}
function currentProgressSteps(ex) { return ex.tier + (ex.extraProgress || 0); }
function exerciseRatio(ex) {
  const total = totalProgressSteps(ex);
  if (total <= 0) return 1;
  return Math.max(0, Math.min(1, currentProgressSteps(ex) / total));
}
function rankFromRatio(ratio) {
  const exact = ratio * 24;
  const idx = Math.min(23, Math.max(0, Math.floor(exact)));
  const r = RANKS[Math.floor(idx / 4)];
  const division = DIVISIONS[idx % 4];
  return { rank: r.name, division, color: r.color, idx, fracInDivision: exact - idx };
}
function globalRatio() {
  const exs = S.exercises;
  if (!exs.length) return 0;
  return exs.reduce((a,e) => a + exerciseRatio(e), 0) / exs.length;
}

function defaultState() {
  return {
    exercises: defaultExercises(),
    history: [],       // {date, exId, group, mode, tierName, sets:[num,...]}
    cardioLog: [],      // {date, type:'echauffement'|'libre', minutes}
    poolOffset: {},      // {"progId:group": offset} — fait tourner les exercices piochés
    lastDoneByProgram: {}, // {progId: 'YYYY-MM-DD'}
    badgesUnlocked: [],
    pendingUpgrades: {},
    resume: null,       // séance ou cardio en cours, persisté pour survivre à un gel / fermeture de l'app
    lastGlobalRatio: 0, // pour afficher le gain de grade après une séance
  };
}
let S = defaultState();

function mergeExercises(savedExs) {
  const base = defaultExercises();
  if (!savedExs || !savedExs.length) return base;
  const savedMap = {};
  savedExs.forEach(e => { savedMap[e.id] = e; });
  return base.map(e => {
    const prev = savedMap[e.id];
    if (!prev) return e;
    const patch = {};
    if (typeof prev.tier === 'number') patch.tier = Math.min(prev.tier, e.tiers.length - 1);
    if (typeof prev.extraProgress === 'number') patch.extraProgress = prev.extraProgress;
    return Object.keys(patch).length ? Object.assign({}, e, patch) : e;
  });
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const base = defaultState();
      S = Object.assign(base, saved);
      S.exercises = mergeExercises(saved.exercises);
      if (!S.pendingUpgrades) S.pendingUpgrades = {};
    }
  } catch(e) { console.error('load error', e); }
  applyBackfill_20260901();
}

function save() {

function exById(id) { return S.exercises.find(e => e.id === id) || (id === 'warmup_bike' ? WARMUP_EX : null); }

// objectif effectif du palier courant : si on est au dernier palier nommé et qu'il est
// maîtrisé, l'objectif continue de grimper (par pas de +2 reps / +10s) jusqu'au plafond
// raisonnable de l'exercice (maxTarget) — au-delà, plus aucune suggestion n'est faite.
function progressionStep(ex) { return ex.mode === 'time' ? 10 : 2; }
function currentTarget(ex) {
  const last = ex.tiers[ex.tiers.length - 1];
  if (ex.tier < ex.tiers.length - 1) return ex.tiers[ex.tier].target;
  const step = progressionStep(ex);
  const raw = last.target + (ex.extraProgress || 0) * step;
  return ex.maxTarget ? Math.min(raw, ex.maxTarget) : raw;
}
function isAtMax(ex) {
  return ex.tier >= ex.tiers.length - 1 && ex.maxTarget && currentTarget(ex) >= ex.maxTarget;
}

/* ============================================================
   AUDIO — bip de fin de timer (Web Audio API, pas de fichier externe)
   ============================================================ */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(times = 2) {
  try {
    const ctx = ensureAudio();
    for (let i = 0; i < times; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = 880;
      const start = ctx.currentTime + i * 0.35;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
      osc.start(start); osc.stop(start + 0.3);
    }
  } catch(e) { console.error('beep error', e); }
  haptic();
}
// iOS exige que l'AudioContext soit créé/débloqué pendant un vrai geste utilisateur —
// sans ça, les bips déclenchés depuis un setInterval (fin de chrono) restent muets.
// On le débloque dès la toute première interaction sur la page.
document.addEventListener('pointerdown', function unlockAudioOnce() {
  ensureAudio();
  document.removeEventListener('pointerdown', unlockAudioOnce);
}, { once: true });

/* ============================================================
   VEILLE ÉCRAN — garde l'écran allumé pendant une séance ou un
   cardio (iOS 16.4+, Android). Sans ça, l'écran se verrouille,
   iOS gèle les timers JS et peut tuer la page -> séance perdue.
   ============================================================ */
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { /* non supporté ou refusé : le rattrapage horloge des timers prend le relais */ }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}
// iOS relâche le verrou quand l'app passe en arrière-plan : on le redemande au retour
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !wakeLock && (sess || cardioActive)) acquireWakeLock();
});

/* ============================================================
   STATS / BADGES
   ============================================================ */
function computeStats(period) {
  const now = new Date();
  const cutoff = new Date(now);
  if (period === 'week') cutoff.setDate(now.getDate() - 7);
  else cutoff.setDate(now.getDate() - 30);

  const inRange = h => new Date(h.date) >= cutoff;
  const entries = S.history.filter(inRange);

  const repsByGroup = { pecs:0, dos:0, epaules:0, biceps:0, triceps:0, abs:0 };
  const repsByEx = {};
  entries.forEach(h => {
    const sum = (h.sets || []).reduce((a,b) => a + b, 0);
    if (repsByGroup[h.group] !== undefined) repsByGroup[h.group] += sum;
    repsByEx[h.exId] = (repsByEx[h.exId] || 0) + sum;
  });

  const sessionDates = [...new Set(entries.map(h => h.date))];
  const cardioMin = S.cardioLog.filter(inRange).reduce((a,c) => a + (c.minutes||0), 0);
  const totalSessions = new Set(S.history.map(h => h.date)).size;

  // pour badges : toujours calculés sur le mois calendaire en cours
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthEntries = S.history.filter(h => new Date(h.date) >= monthStart);
  const monthReps = {};
  monthEntries.forEach(h => {
    const sum = (h.sets || []).reduce((a,b) => a + b, 0);
    monthReps[h.exId] = (monthReps[h.exId] || 0) + sum;
  });
  const monthSessions = new Set(monthEntries.map(h => h.date)).size;
  const streak = computeStreak();

  return { repsByGroup, repsByEx, sessionsCount: sessionDates.length, cardioMin, totalSessions,
    monthReps, monthSessions, streak, dailyVolume: dailyVolume(period, entries) };
}

function computeStreak() {
  const dates = [...new Set(S.history.map(h => h.date))].sort().reverse();
  if (!dates.length) return 0;
  let streak = 1;
  for (let i = 0; i < dates.length - 1; i++) {
    const d1 = new Date(dates[i]), d2 = new Date(dates[i+1]);
    const diffDays = Math.round((d1 - d2) / 86400000);
    if (diffDays <= 3) streak++; else break; // tolérance de 2 jours off entre séances
  }
  return streak;
}

function dailyVolume(period, entries) {
  const days = period === 'week' ? 7 : 30;
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    const vol = entries.filter(h => h.date === key)
      .reduce((a,h) => a + (h.sets||[]).reduce((x,y)=>x+y,0), 0);
    buckets.push({ key, label: d.getDate() + '/' + (d.getMonth()+1), vol });
  }
  return buckets;
}

function checkBadges(stats) {
  const newly = [];
  BADGES.forEach(b => {
    const unlocked = S.badgesUnlocked.includes(b.id);
    if (!unlocked && b.check(stats)) {
      S.badgesUnlocked.push(b.id);
      newly.push(b);
    }
  });
  if (newly.length) save();
  return newly;
}

/* ============================================================
   SÉANCE GUIDÉE
   ============================================================ */
let sess = null;
let timerHandle = null;
let cardioActive = false;

/* ---- Reprise après gel / fermeture de l'app --------------------------------
   La séance en cours ne vit qu'en mémoire (objet sess) tant qu'elle n'est pas
   finie. Si iOS tue la page, tout est perdu. On sauvegarde donc dans S.resume
   l'essentiel après chaque série, et on le restitue au prochain lancement. */
function persistSessionResume() {
  if (!sess) return;
  S.resume = {
    kind: 'session',
    progId: sess.prog.id,
    durationMin: sess.durationMin || null,
    exIds: sess.exIds.slice(),
    setsOverride: sess.setsOverride || {},
    exIdx: sess.exIdx,
    set: sess.set,
    results: sess.results,
    startedAt: sess.startedAt || Date.now(),
  };
  save();
}
function clearResume() {
  if (S.resume) { S.resume = null; save(); }
}

// estimation du temps d'une série (exécution + repos), pour caler le nombre de
// séries sur une durée de séance cible
function estSetSeconds(ex) {
  const t = ex.tiers[ex.tier];
  const target = currentTarget(ex);
  const workSec = ex.mode === 'time' ? target : Math.round(target * 3); // ~3s/rep, estimation grossière
  return workSec + (t.rest || 0);
}
function computeAdjustedSets(exIds, durationMin) {
  const WARMUP_SEC = 360, TRANSITION_SEC = 15;
  const targetSec = durationMin * 60;
  const n = exIds.length;
  let available = targetSec - WARMUP_SEC - TRANSITION_SEC * n;
  if (available < n * 30) available = n * 30; // garde-fou : au moins 30s/exercice
  const perSet = exIds.map(id => estSetSeconds(exById(id)));
  const avgPerSet = perSet.reduce((a,b) => a+b, 0) / n;
  let totalSets = Math.round(available / avgPerSet);
  totalSets = Math.max(n, Math.min(n * 6, totalSets));
  const base = Math.max(1, Math.round(totalSets / n));
  const out = {};
  exIds.forEach(id => { out[id] = Math.min(6, Math.max(1, base)); });
  return out;
}
function estimateSessionSets(prog, durationMin) {
  const exIds = buildProgramExerciseIds(prog);
  const setsMap = computeAdjustedSets(exIds, durationMin);
  return Object.values(setsMap).reduce((a,b) => a+b, 0);
}

function startSession(progId, durationMin) {
  const prog = PROGRAM.find(p => p.id === progId) || PROGRAM[0];
  const realExIds = buildProgramExerciseIds(prog);
  const setsOverride = durationMin ? computeAdjustedSets(realExIds, durationMin) : {};
  sess = {
    prog,
    durationMin: durationMin || null,
    exIds: ['warmup_bike', ...realExIds],
    setsOverride,
    exIdx: 0,
    set: 0,
    reps: 0,
    results: {},
    timeLeft: 0,
    timerRunning: false,
    timerPaused: false,
    phase: 'exercise', // 'exercise' | 'rest'
    startedAt: Date.now(),
  };
  S.lastGlobalRatio = globalRatio();
  persistSessionResume();
  acquireWakeLock();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  buildSessionShell();
  loadExerciseStep();
}

function sessFromResume(r) {
  const prog = PROGRAM.find(p => p.id === r.progId) || PROGRAM[0];
  return {
    prog,
    durationMin: r.durationMin,
    exIds: r.exIds.slice(),
    setsOverride: r.setsOverride || {},
    exIdx: r.exIdx,
    set: r.set || 0,
    reps: 0,
    results: r.results || {},
    timeLeft: 0,
    timerRunning: false,
    timerPaused: false,
    phase: 'exercise',
    startedAt: r.startedAt || Date.now(),
  };
}

// reconstruit une séance interrompue depuis S.resume et reprend au bon endroit
function resumeSession() {
  sess = sessFromResume(S.resume);
  if (typeof S.lastGlobalRatio !== 'number') S.lastGlobalRatio = globalRatio();
  acquireWakeLock();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  buildSessionShell();
  const ex0 = currentSessionEx();
  const savedSet = Math.max(0, Math.min(sess.set, sessionSetsFor(ex0) - 1));
  loadExerciseStep();              // remet sess.set à 0, affiche la 1re série de l'exercice courant
  if (savedSet > 0) {              // des séries étaient déjà faites sur cet exercice : on les repositionne
    sess.set = savedSet;
    const ex = currentSessionEx();
    if (ex.mode === 'time') startExecTimer(); else renderExecReps();
  }
}
function sessionSetsFor(ex) {
  return (sess.setsOverride && sess.setsOverride[ex.id]) || ex.tiers[ex.tier].sets;
}

function buildSessionShell() {
  const app = $('app');
  app.innerHTML = `
    <div class="screen active" id="sessionScreen" style="flex:1; display:flex; flex-direction:column;">
      <div class="session-bar">

        <div class="session-meta">
          <div class="session-eyebrow" id="sessionEyebrow">Séance</div>
          <div class="session-name" id="sessionName">—</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="sessionProgress" style="width:0%"></div></div>
      <div class="ex-dots" id="exDots"></div>
      <div class="session-area" id="sessionArea"></div>
    </div>`;
  $('sessionExitBtn').addEventListener('click', () => {
    openConfirmModal('Quitter la séance ?', 'La progression de cette séance ne sera pas enregistrée.', () => {
      clearInterval(timerHandle); releaseWakeLock(); clearResume();
      sess = null; renderShell(); view = 'home'; renderView();
    });
  });
}

function renderExDots() {
  const wrap = $('exDots');
  wrap.innerHTML = sess.exIds.map((id, i) => {
    const cls = i < sess.exIdx ? 'done' : (i === sess.exIdx ? 'current' : '');
    return `<div class="ex-dot ${cls}"></div>`;
  }).join('');
  $('sessionProgress').style.width = Math.round((sess.exIdx / sess.exIds.length) * 100) + '%';
}

function currentSessionEx() { return exById(sess.exIds[sess.exIdx]); }

function loadExerciseStep() {
  clearInterval(timerHandle);
  const ex = currentSessionEx();
  const t = ex.tiers[ex.tier];
  sess.set = 0;
  sess.reps = currentTarget(ex);
  sess.phase = 'exercise';
  $('sessionEyebrow').textContent = sess.prog.name;
  $('sessionName').textContent = ex.name;
  renderExDots();
  if (ex.mode === 'time') startExecTimer();
  else renderExecReps();
}

// bloc nom d'exercice + bouton info (tooltip dépliable avec la consigne d'exécution)
function execNameBlock(ex) {
  return `
    <div class="exec-name-row">
      <div class="exec-name">${escapeHtml(ex.name)}</div>
      <div class="exec-info-btn" id="execInfoBtn" aria-label="Comment faire">i</div>
    </div>
    <div class="exec-tooltip" id="execTooltip">${escapeHtml(ex.desc || '')}</div>`;
}
function wireExecInfoBtn() {
  const btn = $('execInfoBtn');
  const tip = $('execTooltip');
  if (!btn || !tip) return;
  btn.addEventListener('click', () => { tip.classList.toggle('show'); haptic(); });
}

function renderExecReps() {
  const ex = currentSessionEx();
  const t = ex.tiers[ex.tier];
  const sessionSets = sessionSetsFor(ex);
  const area = $('sessionArea');
  const g = GROUPS[ex.group];
  area.innerHTML = `
    <div class="exec-card">
      <div class="exec-group-tag" style="background:${g.bg}; color:${g.color}">${g.label}</div>
      ${execNameBlock(ex)}
      <div class="exec-tier-name">${escapeHtml(t.name)} · série ${sess.set+1}/${sessionSets}</div>
      <div class="set-dots">${Array.from({length:sessionSets}).map((_,i)=>`<div class="set-dot ${i<sess.set?'done':(i===sess.set?'current':'')}">${i+1}</div>`).join('')}</div>
      <div class="reps-input-row">
        <div class="reps-btn" id="repsMinus">−</div>
        <div class="reps-val" id="repsVal">${sess.reps}</div>
        <div class="reps-btn" id="repsPlus">+</div>
      </div>
      <div class="exec-btn" id="validateSetBtn">Valider la série</div>
    </div>`;
  wireExecInfoBtn();
  $('repsMinus').addEventListener('click', () => { sess.reps = Math.max(0, sess.reps-1); $('repsVal').textContent = sess.reps; haptic(); });
  $('repsPlus').addEventListener('click', () => { sess.reps++; $('repsVal').textContent = sess.reps; haptic(); });
  $('validateSetBtn').addEventListener('click', () => logSet(sess.reps));
}

function startExecTimer() {
  const ex = currentSessionEx();
  const t = ex.tiers[ex.tier];
  const sessionSets = sessionSetsFor(ex);
  const target = currentTarget(ex);
  sess.timeLeft = target;
  sess.timerPaused = false;
  sess.timerRunning = false;
  sess.endAt = 0;
  const g = GROUPS[ex.group];
  const area = $('sessionArea');
  const R = 88, C = 2*Math.PI*R;
  area.innerHTML = `
    <div class="exec-card">
      <div class="exec-group-tag" style="background:${g.bg}; color:${g.color}">${g.label}</div>
      ${execNameBlock(ex)}
      <div class="exec-tier-name">${escapeHtml(t.name)} · série ${sess.set+1}/${sessionSets}</div>
      <div class="set-dots">${Array.from({length:sessionSets}).map((_,i)=>`<div class="set-dot ${i<sess.set?'done':(i===sess.set?'current':'')}">${i+1}</div>`).join('')}</div>
      <div class="timer-ring-wrap">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle class="timer-track" cx="100" cy="100" r="${R}"></circle>
          <circle class="timer-fill" id="timerRing" cx="100" cy="100" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-center"><div class="timer-num" id="timerNum">${target}</div><div class="timer-label">secondes</div></div>
      </div>
      <div class="exec-btn" id="timerStartBtn">Lancer le chrono</div>
    </div>`;
  wireExecInfoBtn();
  const ring = $('timerRing');
  const btn = $('timerStartBtn');
  // chrono basé sur l'horloge (Date.now) et non sur le compte des ticks :
  // si iOS gèle le setInterval (écran verrouillé / app en fond), l'affichage
  // se recale tout seul au retour et la série se valide si le temps est écoulé.
  const tick = () => {
    if (sess.timerPaused || !sess.timerRunning) return;
    const remain = (sess.endAt - Date.now()) / 1000;
    $('timerNum').textContent = Math.max(0, Math.ceil(remain));
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, remain / target)));
    if (remain <= 0) {
      clearInterval(timerHandle);
      sess.timerRunning = false;
      beep(3);
      logSet(target);
    }
  };
  btn.addEventListener('click', () => {
    ensureAudio(); // geste utilisateur direct : bon moment pour débloquer/re-confirmer l'audio
    if (!sess.timerRunning) {
      sess.timerRunning = true;
      sess.timerPaused = false;
      sess.endAt = Date.now() + sess.timeLeft * 1000;
      btn.textContent = 'Pause';
      clearInterval(timerHandle);
      timerHandle = setInterval(tick, 250);
      tick();
    } else if (!sess.timerPaused) {
      sess.timerPaused = true;
      sess.timeLeft = Math.max(0, (sess.endAt - Date.now()) / 1000);
      btn.textContent = 'Reprendre';
      haptic();
    } else {
      sess.timerPaused = false;
      sess.endAt = Date.now() + sess.timeLeft * 1000;
      btn.textContent = 'Pause';
      haptic();
    }
  });
}

function logSet(value) {
  if (!sess || sess._logging) return; // garde anti double-tap
  sess._logging = true;
  const ex = currentSessionEx();
  const id = ex.id;
  if (!sess.results[id]) sess.results[id] = { group: ex.group, mode: ex.mode, tierName: ex.tiers[ex.tier].name, sets: [] };
  sess.results[id].sets.push(value);
  const t = ex.tiers[ex.tier];
  sess.set++;
  haptic();
  persistSessionResume(); // la série est enregistrée -> survit à une fermeture de l'app
  if (sess.set >= sessionSetsFor(ex)) {
    // exercice terminé -> suivant
    goToNextExercise();
  } else {
    // repos entre séries
    if (t.rest > 0) startRest(t.rest, () => { ex.mode === 'time' ? startExecTimer() : renderExecReps(); });
    else (ex.mode === 'time' ? startExecTimer() : renderExecReps());
  }
  if (sess) sess._logging = false;
}

function startRest(seconds, onDone) {
  sess.phase = 'rest';
  sess.timerPaused = false;
  const area = $('sessionArea');
  const R = 88, C = 2*Math.PI*R;
  let endAt = Date.now() + seconds * 1000;
  let remainAtPause = seconds;
  area.innerHTML = `
    <div class="exec-card rest-screen">
      <div class="exec-tier-name" style="margin-bottom:18px;">Repos</div>
      <div class="timer-ring-wrap">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle class="timer-track" cx="100" cy="100" r="${R}"></circle>
          <circle class="timer-fill" id="restRing" cx="100" cy="100" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-center"><div class="timer-num" id="restNum">${seconds}</div><div class="timer-label">secondes</div></div>
      </div>
      <div style="display:flex; gap:8px; max-width:340px; margin:0 auto;">
        <div class="exec-btn ghost" id="pauseRestBtn" style="flex:1;">Pause</div>
        <div class="exec-btn ghost" id="skipRestBtn" style="flex:1;">Passer</div>
      </div>
    </div>`;
  const ring = $('restRing');
  const finish = () => { clearInterval(timerHandle); beep(2); onDone(); };
  timerHandle = setInterval(() => {
    if (sess.timerPaused) return;
    const remain = (endAt - Date.now()) / 1000;
    $('restNum').textContent = Math.max(0, Math.ceil(remain));
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, remain / seconds)));
    if (remain <= 0) finish();
  }, 250);
  $('skipRestBtn').addEventListener('click', finish);
  $('pauseRestBtn').addEventListener('click', () => {
    if (!sess.timerPaused) {
      sess.timerPaused = true;
      remainAtPause = Math.max(0, (endAt - Date.now()) / 1000);
      $('pauseRestBtn').textContent = 'Reprendre';
    } else {
      sess.timerPaused = false;
      endAt = Date.now() + remainAtPause * 1000;
      $('pauseRestBtn').textContent = 'Pause';
    }
    haptic();
  });
}

function goToNextExercise() {
  clearInterval(timerHandle);
  sess.exIdx++;
  sess.set = 0;
  if (sess.exIdx >= sess.exIds.length) { finishSession(); return; }
  persistSessionResume();
  loadExerciseStep();
}

function finishSession() {
  if (!sess) return;
  clearInterval(timerHandle);
  releaseWakeLock();
  const date = sess.startedAt ? new Date(sess.startedAt).toISOString().slice(0,10) : todayStr();
  Object.keys(sess.results).forEach(exId => {
    if (exId === 'warmup_bike') return; // loggé séparément en cardio
    const r = sess.results[exId];
    S.history.push({ date, exId, group: r.group, mode: r.mode, tierName: r.tierName, sets: r.sets });
  });
  if (sess.results['warmup_bike']) {
    const secs = sess.results['warmup_bike'].sets.reduce((a,b)=>a+b,0);
    S.cardioLog.push({ date, type: 'echauffement', minutes: Math.round(secs/60) });
  }
  S.lastDoneByProgram[sess.prog.id] = date;
  sess.prog.blocks.forEach(b => {
    const key = sess.prog.id + ':' + b.group;
    const n = Math.min(b.pick, b.pool.length);
    S.poolOffset[key] = ((S.poolOffset[key] || 0) + n) % b.pool.length;
  });

  const upgrades = detectUpgrades();
  S.pendingUpgrades = {};
  upgrades.forEach(u => S.pendingUpgrades[u.ex.id] = u.type === 'tier' ? { type:'tier', value:u.nextTier } : { type:'target', value:u.nextTarget });
  S.resume = null;
  save();

  const stats = computeStats('month');
  const newBadges = checkBadges(stats);

  renderRecap(upgrades, newBadges);
}

function detectUpgrades() {
  // si les 2 dernières séances loggées pour un exercice atteignent la cible sur toutes les
  // séries -> proposer le palier nommé suivant, ou si on est déjà au dernier palier, faire
  // grimper l'objectif numérique d'un cran (jusqu'au plafond maxTarget de l'exercice).
  const upgrades = [];
  Object.keys(sess.results).forEach(exId => {
    if (exId === 'warmup_bike') return;
    const ex = exById(exId);
    const t = ex.tiers[ex.tier];
    const target = currentTarget(ex);
    const hist = S.history.filter(h => h.exId === exId && !h.backfilled).slice(-2);
    if (hist.length < 2) return;
    const needSets = Math.min(t.sets, (sess.setsOverride && sess.setsOverride[exId]) || t.sets);
    const allHit = hist.every(h => h.sets.length >= needSets && h.sets.every(v => v >= target));
    if (!allHit) return;
    if (ex.tier < ex.tiers.length - 1) {
      upgrades.push({ type:'tier', ex, nextTier: ex.tier + 1 });
    } else if (!isAtMax(ex)) {
      const step = progressionStep(ex);
      const nextTarget = Math.min(target + step, ex.maxTarget || (target + step));
      if (nextTarget > target) upgrades.push({ type:'target', ex, nextTarget });
    }
  });
  return upgrades;
}

function renderRecap(upgrades, newBadges) {
  const area = $('sessionArea');
  $('sessionProgress').style.width = '100%';
  $('exDots').innerHTML = '';
  $('sessionName').textContent = 'Séance terminée';
  let upgradesHtml = '';
  if (upgrades.length) {
    upgradesHtml = `<div class="section-label" style="text-align:left;">Progression débloquée</div>` +
      upgrades.map(u => {
        const readyLabel = u.type === 'tier'
          ? `Prêt pour : <b>${escapeHtml(u.ex.tiers[u.nextTier].name)}</b>`
          : `Prêt pour : <b>${u.nextTarget}${u.ex.mode === 'time' ? 's' : ' reps'}</b> par série`;
        return `
        <div class="ex-card" style="border-left-color:var(--success); text-align:left;">
          <div class="ex-card-top"><div class="ex-name">${escapeHtml(u.ex.name)}</div></div>
          <div class="ex-desc">${readyLabel}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <div class="exec-btn" style="padding:10px; font-size:13px; flex:1;" data-accept="${u.ex.id}">${u.type==='tier' ? 'Passer au palier' : "Monter l'objectif"}</div>
            <div class="exec-btn ghost" style="padding:10px; font-size:13px; flex:1;" data-decline="${u.ex.id}">Plus tard</div>
          </div>
        </div>`;
      }).join('');
  }
  let badgesHtml = '';
  if (newBadges.length) {
    badgesHtml = `<div class="section-label" style="text-align:left;">Badges débloqués</div><div class="badge-row">` +
      newBadges.map(b => `<div class="badge-chip"><div class="badge-chip-mark">${b.mark}</div><div class="badge-chip-label">${escapeHtml(b.label)}</div></div>`).join('') + `</div>`;
  }

  // bilan chiffré de la séance (récompense immédiate, sans dénaturer la lenteur des grades)
  let reps = 0, secs = 0, setCount = 0;
  Object.keys(sess.results).forEach(exId => {
    if (exId === 'warmup_bike') return;
    const r = sess.results[exId];
    r.sets.forEach(v => { setCount++; if (r.mode === 'time') secs += v; else reps += v; });
  });
  const streak = computeStreak();
  const bits = [];
  if (reps) bits.push(`${reps} reps`);
  if (secs) bits.push(`${secs}s de gainage`);
  bits.push(`${setCount} séries`);
  const summaryHtml = `
    <div class="exec-tier-name" style="margin-bottom:16px; line-height:1.7;">
      ${bits.join(' · ')}<br>
      <span style="color:var(--ember-bright);">🔥 ${streak} séance${streak>1?'s':''} d'affilée</span>
    </div>`;

  area.innerHTML = `
    <div class="exec-card" style="max-width:420px;">
      <div style="font-size:44px; margin-bottom:8px;">🏁</div>
      <div class="exec-name" style="font-size:30px;">Bien joué</div>
      ${summaryHtml}
      ${badgesHtml}
      ${upgradesHtml}
      <div class="exec-btn" id="backHomeBtn" style="margin-top:18px;">Retour à l'accueil</div>
    </div>`;
  area.querySelectorAll('[data-accept]').forEach(b => b.addEventListener('click', () => {
    const ex = exById(b.dataset.accept);
    const pending = S.pendingUpgrades[ex.id];
    if (pending) {
      if (pending.type === 'tier') ex.tier = pending.value;
      else ex.extraProgress = (ex.extraProgress || 0) + 1;
    }
    delete S.pendingUpgrades[ex.id];
    // le grade global bouge peu (voulu : endurance) — on ne signale que s'il change vraiment
    const before = rankFromRatio(S.lastGlobalRatio || 0);
    const after = rankFromRatio(globalRatio());
    save();
    if (after.idx > before.idx) toast(`⬆ Grade global : ${after.rank} ${after.division}`);
    else toast(pending && pending.type === 'tier' ? 'Palier mis à jour' : 'Objectif augmenté');
    S.lastGlobalRatio = globalRatio();
    b.closest('.ex-card').style.opacity = '0.4';
  }));
  area.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', () => {
    delete S.pendingUpgrades[b.dataset.decline];
    save();
    b.closest('.ex-card').style.opacity = '0.4';
  }));
  $('backHomeBtn').addEventListener('click', () => {
    S.lastGlobalRatio = globalRatio(); save();
    sess = null; renderShell(); view = 'home'; renderView();
  });
}

/* ============================================================
   CARDIO LIBRE (hors séance)
   ============================================================ */
function cardioShell() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('app').innerHTML = `
    <div class="screen active" style="flex:1; display:flex; flex-direction:column;">
      <div class="session-bar">
        <div class="icon-btn" id="cardioExitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        <div class="session-meta"><div class="session-eyebrow">Cardio libre</div><div class="session-name">Vélo d'appartement</div></div>
      </div>
      <div class="session-area" id="cardioArea"></div>
    </div>`;
  $('cardioExitBtn').addEventListener('click', () => {
    clearInterval(timerHandle); cardioActive = false; releaseWakeLock(); clearResume();
    renderShell(); view = 'home'; renderView();
  });
}

function startFreeCardio() {
  cardioShell();
  let minutes = 25;
  $('cardioArea').innerHTML = `
    <div class="exec-card">
      <div class="exec-name" style="font-size:30px;">Durée</div>
      <div class="reps-input-row">
        <div class="reps-btn" id="minMinus">−</div>
        <div class="reps-val" id="minVal">${minutes}</div>
        <div class="reps-btn" id="minPlus">+</div>
      </div>
      <div class="exec-tier-name" style="margin-bottom:22px;">minutes</div>
      <div class="exec-btn" id="cardioStartBtn">Démarrer</div>
    </div>`;
  $('minMinus').addEventListener('click', () => { minutes = Math.max(5, minutes-5); $('minVal').textContent = minutes; });
  $('minPlus').addEventListener('click', () => { minutes += 5; $('minVal').textContent = minutes; });
  $('cardioStartBtn').addEventListener('click', () => runCardioTimer(minutes));
}

// startedAt fourni = reprise d'un cardio en cours après réouverture de l'app
function runCardioTimer(mins, startedAt) {
  if (!$('cardioArea')) cardioShell();
  const total = mins * 60;
  const startTs = startedAt || Date.now();
  const endAt = startTs + total * 1000;
  cardioActive = true;
  S.resume = { kind: 'cardio', startedAt: startTs, plannedMin: mins };
  save();
  acquireWakeLock();
  const R = 88, C = 2*Math.PI*R;
  $('cardioArea').innerHTML = `
    <div class="exec-card">
      <div class="timer-ring-wrap">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle class="timer-track" cx="100" cy="100" r="${R}"></circle>
          <circle class="timer-fill" id="cardioRing" cx="100" cy="100" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0" style="stroke:var(--cardio)"></circle>
        </svg>
        <div class="timer-center"><div class="timer-num" id="cardioNum">${mins}:00</div><div class="timer-label">min restantes</div></div>
      </div>
      <div class="exec-btn ghost" id="cardioStopBtn">Terminer maintenant</div>
    </div>`;
  const ring = $('cardioRing');
  const finish = (actualMin) => {
    clearInterval(timerHandle);
    cardioActive = false;
    releaseWakeLock();
    beep(3);
    const day = new Date(startTs).toISOString().slice(0,10);
    S.cardioLog.push({ date: day, type: 'libre', minutes: Math.max(1, actualMin) });
    S.resume = null;
    save();
    toast('Séance cardio enregistrée');
    sess = null; renderShell(); view = 'home'; renderView();
  };
  // chrono basé sur l'horloge : reste juste même si iOS gèle le setInterval
  timerHandle = setInterval(() => {
    const left = (endAt - Date.now()) / 1000;
    const m = Math.floor(Math.max(0,left)/60), s = Math.floor(Math.max(0,left)%60);
    $('cardioNum').textContent = m + ':' + String(s).padStart(2,'0');
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, left/total)));
    if (left <= 0) finish(mins);
  }, 250);
  $('cardioStopBtn').addEventListener('click', () => finish(Math.round((Date.now()-startTs)/60000)));
}

/* ============================================================
   INIT
   ============================================================ */
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') e.currentTarget.classList.remove('show'); });

// À l'ouverture : si une séance / un cardio était en cours quand l'app s'est
// fermée (gel iOS, onglet tué…), on propose de la récupérer plutôt que de la perdre.
function checkResume() {
  const r = S.resume;
  if (!r) return;
  const modal = $('modal');

  if (r.kind === 'cardio') {
    const elapsedMin = Math.max(1, Math.round((Date.now() - r.startedAt) / 60000));
    const suggested = Math.min(elapsedMin, r.plannedMin);
    const logCardio = (mn) => {
      const day = new Date(r.startedAt).toISOString().slice(0,10);
      S.cardioLog.push({ date: day, type: 'libre', minutes: mn });
      S.resume = null; save();
      modal.classList.remove('show'); toast('Séance cardio enregistrée'); renderShell(); renderView();
    };
    modal.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title">Cardio interrompu</h3>
        <p class="modal-text">Un vélo de ${r.plannedMin} min lancé il y a ~${elapsedMin} min n'a pas été enregistré (l'app s'est fermée). L'enregistrer ?</p>
        <div class="modal-btn primary" id="resCardioSave">Enregistrer ${suggested} min</div>
        <div class="modal-btn" id="resCardioAdjust">Ajuster la durée</div>
        <div class="modal-btn" id="resCardioDrop" style="color:var(--danger);">Ne rien enregistrer</div>
      </div>`;
    modal.classList.add('show');
    $('resCardioSave').addEventListener('click', () => logCardio(suggested));
    $('resCardioDrop').addEventListener('click', () => { S.resume = null; save(); modal.classList.remove('show'); });
    $('resCardioAdjust').addEventListener('click', () => {
      let mn = suggested;
      modal.innerHTML = `
        <div class="modal-sheet">
          <div class="modal-handle"></div>
          <h3 class="modal-title">Durée réelle</h3>
          <div class="reps-input-row">
            <div class="reps-btn" id="resMinus">−</div>
            <div class="reps-val" id="resVal">${mn}</div>
            <div class="reps-btn" id="resPlus">+</div>
          </div>
          <p class="modal-text" style="text-align:center;">minutes</p>
          <div class="modal-btn primary" id="resSave2">Enregistrer</div>
          <div class="modal-btn" id="resDrop2" style="color:var(--danger);">Ne rien enregistrer</div>
        </div>`;
      $('resMinus').addEventListener('click', () => { mn = Math.max(1, mn - 1); $('resVal').textContent = mn; });
      $('resPlus').addEventListener('click', () => { mn++; $('resVal').textContent = mn; });
      $('resSave2').addEventListener('click', () => logCardio(mn));
      $('resDrop2').addEventListener('click', () => { S.resume = null; save(); modal.classList.remove('show'); });
    });
    return;
  }

  // séance de musculation
  if (!Array.isArray(r.exIds) || r.exIdx >= r.exIds.length) { S.resume = null; save(); return; }
  const prog = PROGRAM.find(p => p.id === r.progId);
  const doneSets = Object.keys(r.results || {}).reduce((a,k) => a + ((r.results[k].sets || []).length), 0);
  modal.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 class="modal-title">Séance interrompue</h3>
      <p class="modal-text">« ${escapeHtml(prog ? prog.name : 'Séance')} » — ${doneSets} série${doneSets>1?'s':''} déjà enregistrée${doneSets>1?'s':''}. Que faire ?</p>
      <div class="modal-btn primary" id="resReprendre">Reprendre la séance</div>
      ${doneSets > 0 ? '<div class="modal-btn" id="resTerminer">Terminer et enregistrer</div>' : ''}
      <div class="modal-btn" id="resAbandon" style="color:var(--danger);">Abandonner</div>
    </div>`;
  modal.classList.add('show');
  $('resReprendre').addEventListener('click', () => { modal.classList.remove('show'); resumeSession(); });
  $('resAbandon').addEventListener('click', () => { S.resume = null; save(); modal.classList.remove('show'); });
  if ($('resTerminer')) $('resTerminer').addEventListener('click', () => {
    modal.classList.remove('show');
    sess = sessFromResume(r);
    if (typeof S.lastGlobalRatio !== 'number') S.lastGlobalRatio = globalRatio();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    buildSessionShell();
    finishSession();
  });
}

load();
renderShell();
renderView();
checkResume();
</script>
